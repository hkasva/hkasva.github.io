<!DOCTYPE html>
<html>
<head>
  <title>Harnoor Kasva</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fhkasva.github.io&countColor=%23263759" style="position: absolute; top: 20px; right: 20px;" />
  <h1>Hi, I'm Harnoor 👋</h1>
  <p>Welcome to my personal website</p>
  <a href="https://x.com/HarnoorKasva" target="_blank" style="display: inline-block; margin-top: 10px; padding: 8px 16px; background: #000; color: white; text-decoration: none; border-radius: 8px; font-size: 14px;">
  Follow me on X →
</a>
  <hr>
<div style="margin-top: 30px; text-align: center; border: 3px dashed #333; padding: 20px; border-radius: 12px; background: rgba(255,255,255,0.5);">
  <p style="font-size: 20px;">😴 Bored? Here's something to do instead of reading my website:</p>
  <button onclick="getActivity()" style="font-size: 18px; padding: 10px 20px; margin-top: 10px; cursor: pointer; border-radius: 8px; border: none; background: #333; color: white;">
    🎲 Give Me Something To Do
  </button>
  <p id="activity-output" style="margin-top: 15px; font-style: italic; min-height: 24px;"></p>
</div>
<script>
  function getActivity() {
    document.getElementById("activity-output").textContent = "Thinking...";
    fetch("https://bored-api.appbrewery.com/random")
      .then(response => response.json())
      .then(data => {
        document.getElementById("activity-output").textContent = data.activity;
      })
      .catch(error => {
        document.getElementById("activity-output").textContent = "Couldn't think of anything — you're on your own.";
      });
  }
</script>
  <div style="margin-top: 30px; text-align: center;">
  <button onclick="getFact()" style="font-size: 18px; padding: 10px 20px; cursor: pointer; border-radius: 8px; border: none; background: #333; color: white;">
    🗣️ Unsolicited advice
  </button>
  <p id="fact-output" style="margin-top: 15px; font-style: italic; min-height: 24px;"></p>
</div>

<script>
  function getFact() {
    document.getElementById("fact-output").textContent = "Loading...";
    fetch("https://api.adviceslip.com/advice")
      .then(response => response.json())
      .then(data => {
        document.getElementById("fact-output").textContent = data.slip.advice;
      })
      .catch(error => {
        document.getElementById("fact-output").textContent = "Couldn't fetch a fact — try again!";
      });
  }
</script>
</body>
</html>
